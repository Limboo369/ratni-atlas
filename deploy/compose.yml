# Overtake na serveru: /srv/apps/war (deovilab-deploy war war.deovilab.com 8101)
services:
  web:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:8101:80"]
    depends_on: [game]
  game:
    build: ./game
    restart: unless-stopped
    init: true
    mem_limit: 384m
    environment:
      ORIGINS: https://war.deovilab.com
    env_file:
      - path: ./secret.env
        required: true
