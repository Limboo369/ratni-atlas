name: Postavljanje servera
on: workflow_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH ključ (prvi put se ubacuje lozinkom)
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          IP: ${{ secrets.SERVER_IP }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          if ! ssh -o BatchMode=yes root@"$IP" true; then
            sudo apt-get install -y -qq sshpass >/dev/null
            ssh-keygen -y -f ~/.ssh/id_ed25519 | sshpass -e ssh root@"$IP" \
              'mkdir -p ~/.ssh && chmod 700 ~/.ssh && cat >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys'
            ssh -o BatchMode=yes root@"$IP" true
          fi
      - name: Postavljanje
        env:
          IP: ${{ secrets.SERVER_IP }}
        run: ssh root@"$IP" "DOMAIN=${{ vars.DOMAIN }} bash -s" < server/setup.sh
