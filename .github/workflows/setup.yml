name: Postavljanje servera
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/setup.yml']

concurrency: server-setup

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH ključ
        env:
          IP: ${{ secrets.SERVER_IP }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$IP" "$HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  BatchMode yes\n' > ~/.ssh/config
          ssh root@"$IP" true
      - name: Postavljanje
        env:
          IP: ${{ secrets.SERVER_IP }}
        run: |
          scp server/deploy.sh root@"$IP":/tmp/deovilab-deploy
          scp server/setup.sh root@"$IP":/tmp/deovilab-setup.sh
          ssh root@"$IP" 'flock /run/deovilab.lock bash /tmp/deovilab-setup.sh </dev/null'
