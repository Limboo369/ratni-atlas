name: Postavljanje servera
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/setup.yml']

concurrency: server

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH ključ
        env:
          IP: ${{ secrets.SERVER_IP }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o BatchMode=yes root@"$IP" true
      - name: Postavljanje
        env:
          IP: ${{ secrets.SERVER_IP }}
        run: |
          scp server/deploy.sh root@"$IP":/tmp/deovilab-deploy
          ssh root@"$IP" 'bash -s' < server/setup.sh
