name: Provjera servera
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: SSH lozinkom, ispis sistema
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
          IP: ${{ secrets.SERVER_IP }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 root@"$IP" \
            'cat /etc/os-release | head -2; uname -r; nproc; free -h | head -2; df -h / | tail -1'
