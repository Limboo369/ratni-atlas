name: Objava igre
on:
  workflow_dispatch:
    inputs:
      bez_testova: { type: boolean, default: false, description: 'Objavi bez testova (samo za hitne slučajeve)' }
  push:
    branches: [main]
    paths: ['src/**', 'build/**', 'package/**', 'deploy/**', '.github/workflows/deploy.yml']

concurrency: deploy-war

env:
  APP: war
  DOMAIN: war.deovilab.com
  PORT: 8101

jobs:
  test:
    if: ${{ !inputs.bez_testova }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --prefix deploy/game
      - run: pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null
      - run: python3 build/make.py
      - run: python3 build/test_ui2.py phone balkan || python3 build/test_ui2.py phone balkan  # 1 ponovni pokušaj (spori CI)
      - run: python3 build/test_mp.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: shots, path: build/shots/ }

  deploy:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build/make.py && mkdir -p deploy/public && cp dist/test.html deploy/public/index.html
      - name: Slanje na server
        env:
          IP: ${{ secrets.SERVER_IP }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$IP" "$HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  BatchMode yes\n' > ~/.ssh/config
          ssh root@"$IP" "mkdir -p /srv/apps/$APP && cd /srv/apps/$APP && { [ -s secret.env ] || { umask 077; echo WS_SECRET=\$(openssl rand -hex 24) > secret.env; }; }"
          rsync -rlptz --delete --exclude secret.env --exclude node_modules deploy/ root@"$IP":/srv/apps/$APP/
          ssh root@"$IP" deovilab-deploy $APP $DOMAIN $PORT
      - run: curl -fsS https://$DOMAIN/ | grep -o '<title>[^<]*'
